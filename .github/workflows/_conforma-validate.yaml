name: Conforma Validate

on:
  workflow_call:
    inputs:
      image:
        description: 'Full image reference (registry/owner/name:tag)'
        required: true
        type: string
      digest:
        description: 'Image manifest digest (sha256:...). If empty, the tag in image is resolved by ec.'
        required: false
        type: string
        default: ''
      strict:
        description: 'Fail on policy violations'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      # renovate: datasource=github-releases depName=conforma/cli
      EC_VERSION: "0.10.52"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ec CLI
        run: |
          cd /tmp
          curl -sSLO "https://github.com/conforma/cli/releases/download/v${EC_VERSION}/ec_linux_amd64"
          curl -sSLO "https://github.com/conforma/cli/releases/download/v${EC_VERSION}/ec_linux_amd64.sha256"
          sed -i 's|dist/||' ec_linux_amd64.sha256
          sha256sum --check ec_linux_amd64.sha256
          chmod +x ec_linux_amd64
          sudo mv ec_linux_amd64 /usr/local/bin/ec

      # Workflow inputs and contexts are passed through env instead of being
      # expanded into the script, so their values cannot inject shell code.
      - name: Login to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Validate image with Conforma
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          STRICT: ${{ inputs.strict }}
        run: |
          IMAGE_REF="${IMAGE}"
          if [[ -n "${DIGEST}" ]]; then
            IMAGE_REF="${IMAGE}@${DIGEST}"
          fi
          ARGS=(
            validate image
            --image "${IMAGE_REF}"
            --policy .conforma/policy.yaml
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/"
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            --show-successes
            --output yaml
          )
          if [[ "${STRICT}" == "true" ]]; then
            ARGS+=(--strict)
          else
            ARGS+=(--strict=false)
          fi
          ec "${ARGS[@]}"
