name: Container Build

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name (without registry prefix)'
        required: true
        type: string
      dockerfile:
        description: 'Path to Containerfile'
        required: true
        type: string
      context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      push:
        description: 'Push images regardless of branch'
        required: false
        type: boolean
        default: false
      image_tag:
        description: 'Custom image tag (default: short git SHA or version tag)'
        required: false
        type: string
        default: ''
      latest:
        description: 'Also tag the image as :latest'
        required: false
        type: boolean
        default: false
      alias_image_name:
        description: 'Optional unsuffixed alias image name (e.g. openvox-server) published from the same manifest as a backward-compat alias for the default major. Empty = no alias.'
        required: false
        type: string
        default: ''
      build_args:
        description: 'Build-time arguments passed to docker build (one KEY=VALUE per line)'
        required: false
        type: string
        default: ''
      allow_failure:
        description: 'Do not fail the workflow if the build/manifest fails (best-effort, e.g. pre-release majors)'
        required: false
        type: boolean
        default: false
      sign:
        description: 'Sign images with cosign keyless signing'
        required: false
        type: boolean
        default: true
    outputs:
      version:
        description: 'Image version tag'
        value: ${{ jobs.prepare.outputs.version }}
      image:
        description: 'Full image reference'
        value: ${{ jobs.manifest.outputs.image }}
      digest:
        description: 'Image manifest digest'
        value: ${{ jobs.manifest.outputs.digest }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Workflow inputs and contexts are passed through env instead of being
      # expanded into the script, so their values cannot inject shell code.
      - name: Determine version
        id: version
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "${IMAGE_TAG}" ]]; then
            echo "version=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build platform matrix
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          MATRIX='{"include":['
          FIRST=true
          for PLATFORM in ${PLATFORMS//,/ }; do
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              MATRIX="${MATRIX},"
            fi
            case "${PLATFORM}" in
              linux/amd64) RUNNER="ubuntu-latest" ;;
              linux/arm64) RUNNER="ubuntu-24.04-arm" ;;
              *)           RUNNER="ubuntu-latest" ;;
            esac
            MATRIX="${MATRIX}{\"platform\":\"${PLATFORM}\",\"runner\":\"${RUNNER}\"}"
          done
          MATRIX="${MATRIX}]}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile }}

  build:
    needs: [hadolint, prepare]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set platform suffix
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "suffix=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr.io
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        continue-on-error: ${{ inputs.allow_failure }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push }}
          build-args: ${{ inputs.build_args }}
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ needs.prepare.outputs.version }}-${{ steps.platform.outputs.suffix }}
          cache-from: type=gha,scope=${{ inputs.image_name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}-${{ matrix.platform }}

  manifest:
    if: inputs.push
    needs: [prepare, build]
    continue-on-error: ${{ inputs.allow_failure }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.result.outputs.image }}
      digest: ${{ steps.result.outputs.digest }}
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
      IMAGE_NAME: ${{ inputs.image_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORMS: ${{ inputs.platforms }}
      LATEST: ${{ inputs.latest }}
      ALIAS: ${{ inputs.alias_image_name }}
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Install syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      - name: Create and push manifest
        run: |
          SOURCES=""
          for PLATFORM in ${PLATFORMS//,/ }; do
            SUFFIX="${PLATFORM//\//-}"
            SOURCES="${SOURCES} ${IMAGE}:${VERSION}-${SUFFIX}"
          done

          docker buildx imagetools create -t "${IMAGE}:${VERSION}" ${SOURCES}

          if [[ "${LATEST}" == "true" ]]; then
            docker buildx imagetools create -t "${IMAGE}:latest" ${SOURCES}
          fi

          # Publish the unsuffixed backward-compat alias for the default major, from the
          # same per-arch sources, so it shares the primary manifest digest.
          if [[ -n "${ALIAS}" ]]; then
            ALIAS_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${ALIAS}"
            docker buildx imagetools create -t "${ALIAS_IMAGE}:${VERSION}" ${SOURCES}
            if [[ "${LATEST}" == "true" ]]; then
              docker buildx imagetools create -t "${ALIAS_IMAGE}:latest" ${SOURCES}
            fi
          fi

      - name: Get manifest digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign image with cosign (keyless)
        if: inputs.sign
        env:
          MANIFEST_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${MANIFEST_DIGEST}"
          if [[ -n "${ALIAS}" ]]; then
            cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${ALIAS}@${MANIFEST_DIGEST}"
          fi

      # BuildKit already attaches an SPDX SBOM to every platform image. Dependency-Track and
      # other CycloneDX-only consumers cannot read it, so syft generates both formats from the
      # pushed per-platform images; they are also published as release assets.
      - name: Generate SBOMs
        env:
          # Packages only: without this, every file owned by an RPM becomes a CycloneDX component
          SYFT_FILE_METADATA_SELECTION: none
        run: |
          INDEX=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}')

          mkdir -p sbom
          for PLATFORM in ${PLATFORMS//,/ }; do
            SUFFIX="${PLATFORM//\//-}"
            DIGEST=$(jq -r --arg os "${PLATFORM%%/*}" --arg arch "${PLATFORM#*/}" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest' <<< "${INDEX}")
            BASE="sbom/${IMAGE_NAME}-${VERSION}-${SUFFIX}"
            syft scan "registry:${IMAGE}@${DIGEST}" \
              --source-name "${IMAGE}" --source-version "${VERSION}" \
              -o "cyclonedx-json=${BASE}.cdx.json" \
              -o "spdx-json=${BASE}.spdx.json"
            echo "${DIGEST}" > "${BASE}.digest"
          done

      - name: Attest CycloneDX SBOMs with cosign (keyless)
        if: inputs.sign
        run: |
          for CDX in sbom/*.cdx.json; do
            DIGEST=$(cat "${CDX%.cdx.json}.digest")
            cosign attest --yes --type cyclonedx --predicate "${CDX}" "${IMAGE}@${DIGEST}"
            if [[ -n "${ALIAS}" ]]; then
              cosign attest --yes --type cyclonedx --predicate "${CDX}" "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${ALIAS}@${DIGEST}"
            fi
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-${{ inputs.image_name }}
          path: sbom/*.json
          retention-days: 7

      - name: Attest manifest index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Attest manifest index (unsuffixed alias)
        if: inputs.alias_image_name != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.alias_image_name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Set output
        id: result
        env:
          MANIFEST_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          echo "image=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "digest=${MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"
