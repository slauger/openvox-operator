name: E2E Run

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to use for E2E tests'
        required: true
        type: string
      operator:
        description: 'Operator variant to install (base, gateway, webhooks-cm)'
        required: true
        type: string
      tests:
        description: 'JSON array of test names to run'
        required: true
        type: string
      openvox_major:
        description: 'OpenVox major for the content images under test (8 or 9)'
        required: false
        type: string
        default: '9'
    secrets:
      E2E_KUBECONFIG:
        description: 'Kubeconfig of the E2E test cluster'
        required: true

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Kubeconfig
        env:
          E2E_KUBECONFIG: ${{ secrets.E2E_KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s\n' "${E2E_KUBECONFIG}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --short 2>/dev/null || kubectl version

      - name: Cleanup previous run
        run: make e2e-cleanup

      # Workflow inputs are passed through env instead of being expanded into
      # the script, so their values cannot inject shell code.
      - name: Install operator (${{ inputs.operator }})
        env:
          OPERATOR: ${{ inputs.operator }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: make "e2e-operator-${OPERATOR}" IMAGE_TAG="${IMAGE_TAG}"

  e2e-test:
    needs: [e2e-setup]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test: ${{ fromJson(inputs.tests) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Kubeconfig
        env:
          E2E_KUBECONFIG: ${{ secrets.E2E_KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s\n' "${E2E_KUBECONFIG}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --short 2>/dev/null || kubectl version

      - name: Run ${{ matrix.test }}
        env:
          TEST: ${{ matrix.test }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          OPENVOX_MAJOR: ${{ inputs.openvox_major }}
        run: make e2e-run-test TEST="${TEST}" IMAGE_TAG="${IMAGE_TAG}" OPENVOX_MAJOR="${OPENVOX_MAJOR}"

  e2e-cleanup:
    needs: [e2e-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Kubeconfig
        env:
          E2E_KUBECONFIG: ${{ secrets.E2E_KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s\n' "${E2E_KUBECONFIG}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Cleanup
        run: make e2e-cleanup
