name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'CHANGELOG*'
      - '.github/*.md'
      - 'mkdocs.yml'
      - 'renovate.json'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'CHANGELOG*'
      - '.github/*.md'
      - 'mkdocs.yml'
      - 'renovate.json'

jobs:
  unicode:
    uses: ./.github/workflows/_unicode-lint.yaml

  go:
    uses: ./.github/workflows/_go.yaml

  helm:
    uses: ./.github/workflows/_helm.yaml

  shellcheck:
    uses: ./.github/workflows/_shellcheck.yaml

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build OpenVox version matrix
        id: matrix
        run: |
          echo "matrix=$(yq -o=json -I=0 '{"include": .include}' images/openvox-versions.yaml)" >> "$GITHUB_OUTPUT"

  openvox-operator:
    needs: go
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-operator
      dockerfile: images/openvox-operator/Containerfile
      context: '.'
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      image_tag: develop

  openvox-server:
    needs: [shellcheck, prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-server-${{ matrix.major }}
      dockerfile: images/openvox-server/Containerfile
      context: '.'
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      image_tag: develop
      build_args: |
        OPENVOXSERVER_VERSION=${{ matrix.server }}
        OPENVOXDB_TERMINI_VERSION=${{ matrix.termini }}
        OPENVOX_VERSION=${{ matrix.openvox }}

  openvox-db:
    needs: [shellcheck, prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-db-${{ matrix.major }}
      dockerfile: images/openvox-db/Containerfile
      context: '.'
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      image_tag: develop
      build_args: |
        OPENVOXDB_VERSION=${{ matrix.db }}

  openvox-e2e-code:
    needs: shellcheck
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-e2e-code
      dockerfile: images/openvox-e2e-code/Containerfile
      context: '.'
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      image_tag: develop
      sign: false

  openvox-agent:
    needs: [shellcheck, prepare]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-agent-${{ matrix.major }}
      dockerfile: images/openvox-agent/Containerfile
      context: 'images/openvox-agent'
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      image_tag: develop
      build_args: |
        OPENVOX_AGENT_VERSION=${{ matrix.agent }}
        OPENVOX_MAJOR=${{ matrix.major }}
      sign: false

  openvox-mock:
    needs: shellcheck
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-mock
      dockerfile: images/openvox-mock/Containerfile
      context: '.'
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      image_tag: develop
      sign: false
