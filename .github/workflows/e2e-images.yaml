name: E2E Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom image tag (default: branch name)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build OpenVox version matrix
        id: matrix
        run: |
          echo "matrix=$(yq -o=json -I=0 '{"include": .include}' images/openvox-versions.yaml)" >> "$GITHUB_OUTPUT"

  openvox-operator:
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-operator
      dockerfile: images/openvox-operator/Containerfile
      context: '.'
      push: true
      image_tag: ${{ inputs.image_tag || github.ref_name }}

  openvox-server:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-server-${{ matrix.major }}
      dockerfile: images/openvox-server/Containerfile
      context: '.'
      push: true
      image_tag: ${{ inputs.image_tag || github.ref_name }}
      build_args: |
        OPENVOXSERVER_VERSION=${{ matrix.server }}
        OPENVOXDB_TERMINI_VERSION=${{ matrix.termini }}
        OPENVOX_VERSION=${{ matrix.openvox }}

  openvox-e2e-code:
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-e2e-code
      dockerfile: images/openvox-e2e-code/Containerfile
      context: '.'
      push: true
      image_tag: ${{ inputs.image_tag || github.ref_name }}
      sign: false

  openvox-agent:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-agent-${{ matrix.major }}
      dockerfile: images/openvox-agent/Containerfile
      context: 'images/openvox-agent'
      push: true
      image_tag: ${{ inputs.image_tag || github.ref_name }}
      build_args: |
        OPENVOX_AGENT_VERSION=${{ matrix.agent }}
        OPENVOX_MAJOR=${{ matrix.major }}
      sign: false

  openvox-db:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-db-${{ matrix.major }}
      dockerfile: images/openvox-db/Containerfile
      context: '.'
      push: true
      image_tag: ${{ inputs.image_tag || github.ref_name }}
      build_args: |
        OPENVOXDB_VERSION=${{ matrix.db }}

  openvox-mock:
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-mock
      dockerfile: images/openvox-mock/Containerfile
      context: '.'
      push: true
      image_tag: ${{ inputs.image_tag || github.ref_name }}
      sign: false
