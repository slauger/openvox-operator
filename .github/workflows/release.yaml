name: Release

on:
  workflow_dispatch:

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create baseline tag for initial release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git tag -l 'v*' | grep -q .; then
            FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
            gh api repos/${{ github.repository }}/git/refs \
              -f ref="refs/tags/v0.0.0" \
              -f sha="${FIRST_COMMIT}"
            git tag v0.0.0 "${FIRST_COMMIT}"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prepare:
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build OpenVox version matrix
        id: matrix
        run: |
          echo "matrix=$(yq -o=json -I=0 '{"include": .include}' images/openvox-versions.yaml)" >> "$GITHUB_OUTPUT"

  openvox-operator:
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-operator
      dockerfile: images/openvox-operator/Containerfile
      context: '.'
      push: true
      latest: true
      image_tag: ${{ needs.semantic-release.outputs.new-release-version }}

  openvox-server:
    needs: [semantic-release, prepare]
    if: needs.semantic-release.outputs.new-release-published == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-server-${{ matrix.major }}
      dockerfile: images/openvox-server/Containerfile
      context: '.'
      push: true
      latest: ${{ matrix.latest }}
      image_tag: ${{ needs.semantic-release.outputs.new-release-version }}
      build_args: |
        OPENVOXSERVER_VERSION=${{ matrix.server }}
        OPENVOXDB_TERMINI_VERSION=${{ matrix.termini }}
        OPENVOX_VERSION=${{ matrix.openvox }}

  openvox-db:
    needs: [semantic-release, prepare]
    if: needs.semantic-release.outputs.new-release-published == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_container-build.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_name: openvox-db-${{ matrix.major }}
      dockerfile: images/openvox-db/Containerfile
      context: '.'
      push: true
      latest: ${{ matrix.latest }}
      image_tag: ${{ needs.semantic-release.outputs.new-release-version }}
      build_args: |
        OPENVOXDB_VERSION=${{ matrix.db }}

  validate-openvox-operator:
    needs: [semantic-release, openvox-operator]
    if: needs.semantic-release.outputs.new-release-published == 'true'
    uses: ./.github/workflows/_conforma-validate.yaml
    permissions:
      contents: read
      id-token: write
      packages: read
    with:
      image: ${{ needs.openvox-operator.outputs.image }}
      digest: ${{ needs.openvox-operator.outputs.digest }}

  validate-openvox-server:
    needs: [semantic-release, prepare, openvox-server]
    if: needs.semantic-release.outputs.new-release-published == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_conforma-validate.yaml
    permissions:
      contents: read
      id-token: write
      packages: read
    with:
      # Matrixed build job outputs collapse to a single value, so reconstruct the
      # per-major image reference; ec resolves the tag to a digest itself.
      image: ghcr.io/${{ github.repository_owner }}/openvox-server-${{ matrix.major }}:${{ needs.semantic-release.outputs.new-release-version }}

  validate-openvox-db:
    needs: [semantic-release, prepare, openvox-db]
    if: needs.semantic-release.outputs.new-release-published == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_conforma-validate.yaml
    permissions:
      contents: read
      id-token: write
      packages: read
    with:
      image: ghcr.io/${{ github.repository_owner }}/openvox-db-${{ matrix.major }}:${{ needs.semantic-release.outputs.new-release-version }}

  helm-charts:
    needs: [semantic-release, openvox-operator, openvox-server, openvox-db]
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Login to ghcr.io
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "${{ github.token }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Inject version into Chart.yaml
        run: |
          VERSION="${{ needs.semantic-release.outputs.new-release-version }}"
          for chart in openvox-operator openvox-stack openvox-db-postgres; do
            sed -i "s/^version:.*/version: ${VERSION}/" charts/${chart}/Chart.yaml
            sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/${chart}/Chart.yaml
          done

      - name: Package and push charts
        id: push-charts
        run: |
          DIGESTS=""
          for chart in openvox-operator openvox-stack openvox-db-postgres; do
            helm package charts/${chart}
            OUTPUT=$(helm push ${chart}-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1)
            DIGEST=$(echo "${OUTPUT}" | grep -oP 'sha256:[a-f0-9]+')
            DIGESTS="${DIGESTS}${chart}=${DIGEST}\n"
          done
          echo -e "${DIGESTS}" > chart-digests.txt

      - name: Sign Helm charts with cosign (keyless)
        run: |
          while IFS='=' read -r chart digest; do
            [ -z "${chart}" ] && continue
            cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/${chart}@${digest}"
          done < chart-digests.txt

      - name: Install oras
        uses: oras-project/setup-oras@v2

      - name: Push ArtifactHub metadata
        run: |
          for chart in openvox-operator openvox-stack openvox-db-postgres; do
            oras push "ghcr.io/${{ github.repository_owner }}/charts/${chart}:artifacthub.io" \
              --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
              artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
          done

      - name: Upload chart artifacts
        uses: actions/upload-artifact@v7
        with:
          name: helm-charts
          path: '*.tgz'

  release-assets:
    needs: [semantic-release, helm-charts]
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download chart artifacts
        uses: actions/download-artifact@v8
        with:
          name: helm-charts

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.semantic-release.outputs.new-release-version }}"
          gh release upload "v${VERSION}" *.tgz

      - name: Append OpenVox component versions to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.semantic-release.outputs.new-release-version }}"
          ROWS=$(yq -r '.include[] | "| " + .major + " | " + .server + " | " + .db + " | " + .agent + " |"' images/openvox-versions.yaml)
          BODY=$(gh release view "v${VERSION}" --json body -q .body)
          {
            printf '%s\n\n' "${BODY}"
            printf '## OpenVox component versions\n\n'
            printf 'Content images shipped with this release. Major 8 is the default and the only one tagged `:latest`; major 9 is a pre-release.\n\n'
            printf '| Major | openvox-server | openvox-db | openvox-agent |\n'
            printf '|---|---|---|---|\n'
            printf '%s\n' "${ROWS}"
          } > release-notes.md
          gh release edit "v${VERSION}" --notes-file release-notes.md
