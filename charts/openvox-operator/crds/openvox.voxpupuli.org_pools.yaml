---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: pools.openvox.voxpupuli.org
spec:
  group: openvox.voxpupuli.org
  names:
    kind: Pool
    listKind: PoolList
    plural: pools
    singular: pool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.service.type
      name: Type
      type: string
    - jsonPath: .status.endpoints
      name: Endpoints
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Pool is the Schema for the pools API.
          It owns a Kubernetes Service that selects Server Pods whose poolRefs include this Pool.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PoolSpec defines the desired state of Pool.
            properties:
              route:
                description: Route configures external access via Gateway API TLSRoute.
                properties:
                  enabled:
                    default: false
                    description: Enabled activates TLSRoute creation for this Pool.
                    type: boolean
                  gatewayRef:
                    description: GatewayRef references the Gateway to attach the TLSRoute
                      to.
                    properties:
                      name:
                        description: Name of the Gateway.
                        type: string
                      sectionName:
                        description: SectionName of the Gateway listener.
                        type: string
                    required:
                    - name
                    type: object
                  hostname:
                    description: Hostname is the SNI hostname (e.g. "production.puppet.example.com").
                    type: string
                  injectDNSAltName:
                    default: false
                    description: |-
                      InjectDNSAltName automatically adds the hostname to the Certificate's dnsAltNames
                      of all Servers selected by this Pool.
                    type: boolean
                required:
                - enabled
                type: object
                x-kubernetes-validations:
                - message: hostname is required when route is enabled
                  rule: '!self.enabled || size(self.hostname) > 0'
                - message: gatewayRef.name is required when route is enabled
                  rule: '!self.enabled || size(self.gatewayRef.name) > 0'
              service:
                description: Service defines the Kubernetes Service configuration.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations are additional annotations for the Service.
                    type: object
                  externalIPs:
                    description: |-
                      ExternalIPs is a list of IP addresses for which nodes in the cluster
                      will also accept traffic for this service.
                    items:
                      type: string
                    type: array
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels are additional labels for the Service.
                    type: object
                  nodePort:
                    description: |-
                      NodePort is the port on each node for type NodePort or LoadBalancer.
                      If unset, Kubernetes auto-assigns a port from the node port range.
                    format: int32
                    type: integer
                  port:
                    default: 8140
                    description: Port is the Service port.
                    format: int32
                    type: integer
                  type:
                    default: ClusterIP
                    description: Type is the Service type (ClusterIP, LoadBalancer,
                      NodePort).
                    type: string
                type: object
            type: object
          status:
            description: PoolStatus defines the observed state of Pool.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoints:
                description: Endpoints is the number of Pods behind the Service.
                format: int32
                type: integer
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation that was last processed by
                  the controller. A value below .metadata.generation means the rest of this
                  status has not caught up with the current spec yet.
                format: int64
                type: integer
              serviceName:
                description: ServiceName is the name of the created Kubernetes Service.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
