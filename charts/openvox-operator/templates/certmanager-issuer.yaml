{{- $wantCA := or (and .Values.webhook.enabled .Values.webhook.certManager.enabled) (and .Values.metrics.enabled .Values.metrics.secure .Values.metrics.certManager.enabled) }}
{{- if $wantCA }}
# Shared issuer chain. Both the webhook and the metrics endpoint sign their
# serving certificates with it, so it is rendered when either asks for one -
# the metrics endpoint must not depend on webhooks being enabled.
# Self-signed issuer for bootstrapping
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "openvox-operator.fullname" . }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvox-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
# CA certificate signed by the self-signed issuer
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "openvox-operator.fullname" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvox-operator.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ include "openvox-operator.fullname" . }}-ca
  secretName: {{ include "openvox-operator.fullname" . }}-ca-cert
  duration: 87600h # 10 years
  renewBefore: 720h # 30 days
  issuerRef:
    name: {{ include "openvox-operator.fullname" . }}-selfsigned
    kind: Issuer
    group: cert-manager.io
---
# CA issuer using the CA certificate
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "openvox-operator.fullname" . }}-ca-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvox-operator.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "openvox-operator.fullname" . }}-ca-cert
{{- end }}
