{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "openvox-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openvox-operator.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "openvox-operator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval | default "30s" }}
      {{- if .Values.metrics.secure }}
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        {{- if .Values.metrics.certManager.enabled }}
        # Verified against the CA that issued the serving certificate.
        serverName: {{ include "openvox-operator.fullname" . }}-metrics.{{ .Release.Namespace }}.svc
        ca:
          secret:
            name: {{ include "openvox-operator.fullname" . }}-ca-cert
            key: ca.crt
        {{- else }}
        # Without cert-manager the operator generates a self-signed certificate
        # at startup and a new one on every restart, so there is nothing stable
        # to verify against. The endpoint is protected by the authentication
        # filter rather than by this certificate.
        insecureSkipVerify: true
        {{- end }}
      {{- end }}
{{- end }}
