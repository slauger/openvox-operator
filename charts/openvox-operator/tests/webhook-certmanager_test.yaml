suite: Webhook cert-manager resources
templates:
  - templates/webhook-certmanager.yaml
tests:
  - it: should not render when webhook is disabled
    asserts:
      - hasDocuments:
          count: 0

  # The issuer chain moved to certmanager-issuer.yaml, because the metrics
  # endpoint needs it too and must not depend on webhooks being enabled. This
  # template now carries only the webhook serving certificate.
  - it: should render only the webhook certificate when webhook is enabled
    set:
      webhook:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: should render the webhook Certificate
    set:
      webhook:
        enabled: true
    documentIndex: 0
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: spec.secretName
          value: RELEASE-NAME-openvox-operator-webhook-cert
      - equal:
          path: spec.duration
          value: 8760h
      - equal:
          path: spec.renewBefore
          value: 720h
      - lengthEqual:
          path: spec.dnsNames
          count: 4
      - equal:
          path: spec.issuerRef.name
          value: RELEASE-NAME-openvox-operator-ca-issuer

  - it: should use custom cert-manager duration and renewBefore
    set:
      webhook:
        enabled: true
        certManager:
          duration: 17520h
          renewBefore: 1440h
    documentIndex: 0
    asserts:
      - equal:
          path: spec.duration
          value: 17520h
      - equal:
          path: spec.renewBefore
          value: 1440h
