# @schema minimum:1
# -- Number of operator pod replicas.
replicaCount: 1

image:
  # @schema required:true
  # -- Image repository.
  repository: ghcr.io/slauger/openvox-operator
  # -- Image tag. Ignored if digest is set.
  tag: latest
  # @schema type:string;pattern:^sha256:[a-f0-9]{64}$
  # -- Image digest. Takes precedence over tag.
  digest: "" # @schema hidden
  # @schema enum:[Always, IfNotPresent, Never]
  # -- Image pull policy.
  pullPolicy: Always

# -- Image pull secrets for private registries.
imagePullSecrets: []

# -- Annotations applied to the operator Pod template (e.g. for log collectors,
# Prometheus scraping, or forcing rollouts via a checksum annotation).
podAnnotations: {}

serviceAccount:
  # -- Create a service account for the operator.
  create: true
  # -- Service account name. Auto-generated if empty.
  name: ""
  # -- Annotations added to the service account.
  annotations: {}

# -- Enable leader election for controller manager.
leaderElect: true

# Operator scope configuration.
scope:
  # @schema enum:[cluster, namespace]
  # -- Operator scope mode. cluster: watches all namespaces (ClusterRole).
  # namespace: watches a single namespace (Role).
  mode: cluster
  # -- Namespace to watch when mode is namespace. Defaults to release namespace if empty.
  watchNamespace: ""

gatewayAPI:
  # -- Enable TLSRoute support via Gateway API.
  enabled: true

# -- CPU/memory resource requests and limits.
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi

# Admission webhook configuration. When enabled the operator serves CRD
# validation/mutation webhooks. The webhook needs a TLS server certificate;
# use either cert-manager or an existing Secret.
webhook:
  # -- Enable CRD validation/mutation webhooks.
  enabled: false
  # @schema minimum:1;maximum:65535
  # -- Port for the webhook server.
  port: 9443
  certManager:
    # -- Use cert-manager to provision webhook TLS certificates.
    enabled: true
    # -- Certificate duration (e.g. 8760h for 1 year).
    duration: 8760h
    # -- Renew certificate before expiry (e.g. 720h for 30 days).
    renewBefore: 720h
  tls:
    # -- Name of an existing TLS Secret containing tls.crt, tls.key, and ca.crt.
    certSecret: ""
    # -- Base64-encoded CA certificate for the webhook configuration.
    caBundle: ""

# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
