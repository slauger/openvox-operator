signingPolicies:
  - name: autosign-any
    any: true

# config.code is set as a list via --set-json in the chainsaw test (a PVC "production"
# environment plus an image mountPath), so it is intentionally not defined here.

servers:
  - name: ca
    ca: true
    server: true
    poolRefs: [ca, server]
    certificate:
      certname: puppet
      dnsAltNames:
        - e2e-code-pvc-server
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi

pools:
  - name: ca
    service:
      type: ClusterIP
      port: 8140
  - name: server
    service:
      type: ClusterIP
      port: 8140
