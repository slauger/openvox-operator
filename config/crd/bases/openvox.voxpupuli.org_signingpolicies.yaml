  name: signingpolicies.openvox.voxpupuli.org
spec:
  group: openvox.voxpupuli.org
  names:
    kind: SigningPolicy
    listKind: SigningPolicyList
    plural: signingpolicies
    shortNames:
    - sp
    singular: signingpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.certificateAuthorityRef
      name: CA
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SigningPolicy is the Schema for the signingpolicies API.
          It defines a policy for automatic CSR signing against a CertificateAuthority.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SigningPolicySpec defines the desired state of SigningPolicy.
              Between policies: OR (any match signs). Within a policy: AND (all set fields must match).
            properties:
              any:
                description: Any when true signs all CSRs unconditionally.
                type: boolean
              certificateAuthorityRef:
                description: CertificateAuthorityRef references the CertificateAuthority
                  this policy applies to.
                type: string
              certnames:
                description: |-
                  Certnames defines allowed certname glob patterns. The certname must match
                  at least one.
                properties:
                  allow:
                    description: Allow is a list of glob patterns. The certname must
                      match at least one.
                    items:
                      type: string
                    type: array
                required:
                - allow
                type: object
              csrAttributes:
                description: |-
                  CSRAttributes defines CSR extension attributes that must all match (AND logic).
                  Each entry specifies an attribute name and the expected value (inline or from a Secret).
                items:
                  description: |-
                    CSRAttributeMatch defines a single CSR extension attribute to match.
                    Either value or valueFrom may be set, not both.
                  properties:
                    name:
                      description: Name is the CSR extension attribute name (e.g.
                        pp_preshared_key, pp_environment).
                      type: string
                    value:
                      description: Value is the expected attribute value (inline).
                      type: string
                    valueFrom:
                      description: ValueFrom references a Secret key containing the
                        expected value.
                      properties:
                        secretKeyRef:
                          description: SecretKeyRef selects a key from a Secret.
                          properties:
                            key:
                              description: Key is the key within the Secret.
                              type: string
                            name:
                              description: Name is the name of the Secret.
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - secretKeyRef
                      type: object
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: value and valueFrom are mutually exclusive
                    rule: '!(has(self.value) && size(self.value) > 0 && has(self.valueFrom))'
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              dnsAltNames:
                description: |-
                  DNSAltNames defines allowed DNS subject alternative name patterns (glob).
                  If a CSR carries DNS SANs and this is not set, the CSR is denied.
                properties:
                  allow:
                    description: Allow is a list of glob patterns. The certname must
                      match at least one.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                required:
                - allow
                type: object
              emailAltNames:
                description: |-
                  EmailAltNames defines allowed email subject alternative name patterns. A "*"
                  wildcard matches any run of characters, including "@". If a CSR carries email
                  SANs and this is not set, the CSR is denied.
                properties:
                  allow:
                    description: Allow is a list of glob patterns. The certname must
                      match at least one.
                    items:
                      type: string
                    type: array
                required:
                - allow
                type: object
              extensions:
                description: |-
                  Extensions lists Puppet CSR extension names (e.g. pp_cli_auth) that a CSR
                  matched by this policy is permitted to carry. Privileged authorization
                  extensions (the 1.3.6.1.4.1.34380.1.3 arc: pp_cli_auth, pp_authorization,
                  pp_auth_token) are denied unless listed here; this gate applies to every
                  policy, including one with any=true. Trusted-fact extensions are unaffected.
                properties:
                  allow:
                    description: Allow is a list of glob patterns. The certname must
                      match at least one.
                    items:
                      type: string
                    type: array
                required:
                - allow
                type: object
              ipAltNames:
                description: |-
                  IPAltNames defines allowed IP subject alternative names as CIDR ranges
                  (e.g. "10.0.0.0/16", "::1/128"). If a CSR carries IP SANs and this is not
                  set, the CSR is denied.
                properties:
                  allow:
                    description: Allow is a list of glob patterns. The certname must
                      match at least one.
                    items:
                      type: string
                    type: array
                required:
                - allow
                type: object
              uriAltNames:
                description: |-
                  URIAltNames defines allowed URI subject alternative name patterns. A "*"
                  wildcard matches any run of characters, including "/". If a CSR carries URI
                  SANs and this is not set, the CSR is denied.
                properties:
                  allow:
                    description: Allow is a list of glob patterns. The certname must
                      match at least one.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                required:
                - allow
                type: object
            required:
            - certificateAuthorityRef
            type: object
          status:
            description: SigningPolicyStatus defines the observed state of SigningPolicy.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation that was last processed by
                  the controller. A value below .metadata.generation means the rest of this
                  status has not caught up with the current spec yet.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is a coarse, human-readable summary of the observed state.

                  It is derived on every reconcile and is never read back as controller
                  input: use Conditions for anything machine-readable. Editing or losing
                  the phase does not change what the operator does.
                enum:
                - Active
                - Error
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
