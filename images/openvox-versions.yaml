# Single source of truth for the OpenVox versions baked into the content images.
#
# The image name encodes the OpenVox major (openvox-server-8 / openvox-server-9),
# the image tag stays the operator release version. CI/release/e2e workflows read
# this file (yq -o=json '.include') to build the per-major matrix and pass the
# versions as build-args to the Containerfiles.
#
# Renovate keeps the pins current, each entry within its own major line. The entry
# with `latest: true` is the default major: it is the only one tagged :latest and
# the only one published under the unsuffixed names (openvox-server / openvox-db).
# Major 9 is the default; major 8 stays in the matrix for existing installations.
include:
  - major: "9"
    latest: true
    # renovate: datasource=github-releases depName=OpenVoxProject/openvox-server
    server: 9.1.0
    # renovate: datasource=github-releases depName=OpenVoxProject/openvoxdb
    termini: 9.1.0
    # renovate: datasource=github-releases depName=OpenVoxProject/openvox
    openvox: 9.2.1
    # renovate: datasource=github-releases depName=OpenVoxProject/openvoxdb
    db: 9.1.0
    # renovate: datasource=github-releases depName=OpenVoxProject/openvox
    agent: 9.2.1
  - major: "8"
    latest: false
    # renovate: datasource=github-releases depName=OpenVoxProject/openvox-server
    server: 8.17.1
    # renovate: datasource=github-releases depName=OpenVoxProject/openvoxdb
    termini: 8.17.1
    # renovate: datasource=github-releases depName=OpenVoxProject/openvox
    openvox: 8.31.2
    # openvoxdb-8.16.0.tar.gz is the FIPS build: puppetdb.jar lacks BouncyCastle and
    # the server crashes at startup with ClassNotFoundException. 8.17.0 ships the
    # regular BouncyCastle provider again; renovate keeps skipping 8.16.0.
    # renovate: datasource=github-releases depName=OpenVoxProject/openvoxdb
    db: 8.17.1
    # renovate: datasource=github-releases depName=OpenVoxProject/openvox
    agent: 8.31.2
