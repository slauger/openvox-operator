apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: autosign-policy
spec:
  namespace: e2e-autosign-policy
  bindings:
    - name: registry
      value: (env('IMAGE_REGISTRY') || 'ghcr.io/slauger')
    - name: imageTag
      value: (env('IMAGE_TAG') || 'latest')
    - name: major
      value: (env('OPENVOX_MAJOR') || '9')
  steps:
    - name: Install openvox-stack
      try:
        - script:
            timeout: 2m
            content: |
              REPO_ROOT=$(git rev-parse --show-toplevel)
              IMAGE_TAG=${IMAGE_TAG:-$(git describe --always)}
              IMAGE_REGISTRY=${IMAGE_REGISTRY:-ghcr.io/slauger}
              helm upgrade --install e2e-autosign-policy "${REPO_ROOT}/charts/openvox-stack" \
                --namespace e2e-autosign-policy --create-namespace \
                --values "${REPO_ROOT}/charts/openvox-stack/ci/autosign-policy-values.yaml" \
                --set config.image.repository=${IMAGE_REGISTRY}/openvox-server-${OPENVOX_MAJOR:-9} \
                --set config.image.tag="${IMAGE_TAG}" \
                --set config.image.pullPolicy=Always \
                --set config.code.image=${IMAGE_REGISTRY}/openvox-e2e-code:${IMAGE_TAG}
      catch:
        - events: {}

    - name: Assert Server is Running
      try:
        - assert:
            resource:
              apiVersion: openvox.voxpupuli.org/v1alpha1
              kind: Server
              metadata:
                name: e2e-autosign-policy-ca
              status:
                phase: Running
                ready: 1
                desired: 1

    - name: Run Puppet agent with matching CSR attribute (expect success)
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: puppet-agent-match
                namespace: e2e-autosign-policy
              spec:
                backoffLimit: 0
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: puppet-agent
                        image: (join('', [$registry, '/openvox-agent-', $major, ':', $imageTag]))
                        imagePullPolicy: Always
                        command: ["sh", "-c"]
                        args:
                          - |
                            mkdir -p /etc/puppetlabs/puppet
                            cat > /etc/puppetlabs/puppet/csr_attributes.yaml << 'CSRATTR'
                            extension_requests:
                              pp_preshared_key: e2e-correct-key
                            CSRATTR
                            puppet agent --test \
                              --server e2e-autosign-policy-server \
                              --waitforcert 30 \
                              --certname agent-match-test;
                            EXIT=$?;
                            if [ $EXIT -eq 0 ] || [ $EXIT -eq 2 ]; then exit 0; else exit $EXIT; fi
                        securityContext:
                          runAsUser: 0
        - script:
            timeout: 5m
            content: |
              kubectl wait --for=condition=Complete job/puppet-agent-match \
                -n e2e-autosign-policy --timeout=300s

    - name: Run Puppet agent with wrong CSR attribute (expect failure)
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: puppet-agent-nomatch
                namespace: e2e-autosign-policy
              spec:
                activeDeadlineSeconds: 60
                backoffLimit: 0
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: puppet-agent
                        image: (join('', [$registry, '/openvox-agent-', $major, ':', $imageTag]))
                        imagePullPolicy: Always
                        command: ["sh", "-c"]
                        args:
                          - |
                            mkdir -p /etc/puppetlabs/puppet
                            cat > /etc/puppetlabs/puppet/csr_attributes.yaml << 'CSRATTR'
                            extension_requests:
                              pp_preshared_key: wrong-key
                            CSRATTR
                            puppet agent --test \
                              --server e2e-autosign-policy-server \
                              --waitforcert 5 \
                              --certname agent-nomatch-test;
                            EXIT=$?;
                            if [ $EXIT -eq 0 ] || [ $EXIT -eq 2 ]; then exit 0; else exit $EXIT; fi
                        securityContext:
                          runAsUser: 0
        - script:
            timeout: 3m
            content: |
              kubectl wait --for=jsonpath='{.status.failed}'=1 job/puppet-agent-nomatch \
                -n e2e-autosign-policy --timeout=120s

    - name: Agent requesting the reserved operator certname (expect failure)
      description: |
        The CA auth.conf grants admin rights to the operator-signing certname as
        well as to the pp_cli_auth extension, so an agent that obtained a
        certificate under that name would be a CA admin.

        This agent presents the *correct* preshared key, so the policy itself
        would approve it.

        What this step can and cannot show: the operator already holds a
        certificate under that name, so puppetserver would refuse a second CSR
        for it regardless. The job failing is therefore a regression guard, not
        proof of the reservation. The reservation matters for the window before
        the operator issues its own certificate, and after that certificate is
        removed - neither of which is reachable from a chainsaw step. It is
        proven by unit tests in cmd/autosign; what is asserted end to end here
        is that the operator wires the reservation into the rendered policy.
      try:
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: puppet-agent-reserved
                namespace: e2e-autosign-policy
              spec:
                activeDeadlineSeconds: 60
                backoffLimit: 0
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: puppet-agent
                        image: (join('', [$registry, '/openvox-agent-', $major, ':', $imageTag]))
                        imagePullPolicy: Always
                        command: ["sh", "-c"]
                        args:
                          - |
                            mkdir -p /etc/puppetlabs/puppet
                            cat > /etc/puppetlabs/puppet/csr_attributes.yaml << 'CSRATTR'
                            extension_requests:
                              pp_preshared_key: e2e-correct-key
                            CSRATTR
                            puppet agent --test \
                              --server e2e-autosign-policy-server \
                              --waitforcert 5 \
                              --certname e2e-autosign-policy-ca-operator;
                            EXIT=$?;
                            if [ $EXIT -eq 0 ] || [ $EXIT -eq 2 ]; then exit 0; else exit $EXIT; fi
                        securityContext:
                          runAsUser: 0
        - script:
            timeout: 3m
            content: |
              kubectl wait --for=jsonpath='{.status.failed}'=1 job/puppet-agent-reserved \
                -n e2e-autosign-policy --timeout=120s
        - script:
            timeout: 1m
            content: |
              set -eu
              # Assert the operator actually wired the reservation into the
              # policy the autosign binary reads. Checking the CA's signed
              # directory would prove nothing here: the operator legitimately
              # holds a certificate under this name, so the file exists either
              # way - and because the name is taken, puppetserver would refuse a
              # second CSR for it even without the reservation.
              POLICY=$(kubectl get secret e2e-autosign-policy-ca-autosign-policy \
                -n e2e-autosign-policy -o jsonpath='{.data.autosign-policy\.yaml}' | base64 -d)

              echo "${POLICY}" | grep -q "reservedCertnames:" \
                || { echo "ERROR: the rendered policy carries no reservation"; echo "${POLICY}"; exit 1; }
              echo "${POLICY}" | grep -q "e2e-autosign-policy-ca-operator" \
                || { echo "ERROR: the operator certname is not reserved"; echo "${POLICY}"; exit 1; }
              echo "OK: the operator certname is reserved in the rendered policy"
      catch:
        - events: {}

    - name: Change the SigningPolicy and assert it applies without rolling the CA pod
      try:
        - script:
            timeout: 6m
            content: |
              set -eu
              NS=e2e-autosign-policy
              DEPLOY=e2e-autosign-policy-ca
              SECRET=e2e-autosign-policy-ca-autosign-policy
              kubectl get deploy "${DEPLOY}" -n "${NS}" -o jsonpath='{.metadata.generation}' > /tmp/autosign-policy-generation
              kubectl get pods -n "${NS}" -o name | grep "^pod/${DEPLOY}-" | grep -v -- '-ca-setup-' | sort > /tmp/autosign-policy-pods
              echo "generation=$(cat /tmp/autosign-policy-generation) pods=$(cat /tmp/autosign-policy-pods)"

              # The policy Secret is mounted as a directory, so the kubelet syncs the new
              # policy into the running CA pod: the change must apply without a rollout.
              kubectl patch signingpolicies.openvox.voxpupuli.org preshared-key -n "${NS}" --type=merge \
                -p '{"spec":{"csrAttributes":[{"name":"pp_preshared_key","value":"e2e-rotated-key"}]}}'

              for _ in $(seq 1 30); do
                kubectl get secret "${SECRET}" -n "${NS}" -o jsonpath='{.data.autosign-policy\.yaml}' \
                  | base64 -d | grep -q 'e2e-rotated-key' && break
                sleep 5
              done
              kubectl get secret "${SECRET}" -n "${NS}" -o jsonpath='{.data.autosign-policy\.yaml}' \
                | base64 -d | grep -q 'e2e-rotated-key' \
                || { echo "ERROR: the policy Secret was not re-rendered after the SigningPolicy update"; exit 1; }
              echo "OK: policy Secret carries the rotated key"

              # puppetserver evaluates autosign once, when the CSR is submitted, so the
              # agent may only start once the kubelet has synced the Secret into the pod.
              POD=$(head -1 /tmp/autosign-policy-pods)
              for _ in $(seq 1 36); do
                kubectl exec -n "${NS}" "${POD}" -- cat /etc/puppetlabs/puppet/autosign-policy/autosign-policy.yaml \
                  | grep -q 'e2e-rotated-key' && break
                sleep 5
              done
              kubectl exec -n "${NS}" "${POD}" -- cat /etc/puppetlabs/puppet/autosign-policy/autosign-policy.yaml \
                | grep -q 'e2e-rotated-key' \
                || { echo "ERROR: the rotated policy never reached the running CA pod"; exit 1; }
              echo "OK: the running CA pod sees the rotated policy"
        - apply:
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: puppet-agent-rotated
                namespace: e2e-autosign-policy
              spec:
                backoffLimit: 0
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: puppet-agent
                        image: (join('', [$registry, '/openvox-agent-', $major, ':', $imageTag]))
                        imagePullPolicy: Always
                        command: ["sh", "-c"]
                        args:
                          - |
                            mkdir -p /etc/puppetlabs/puppet
                            cat > /etc/puppetlabs/puppet/csr_attributes.yaml << 'CSRATTR'
                            extension_requests:
                              pp_preshared_key: e2e-rotated-key
                            CSRATTR
                            puppet agent --test \
                              --server e2e-autosign-policy-server \
                              --waitforcert 30 \
                              --certname agent-rotated-test;
                            EXIT=$?;
                            if [ $EXIT -eq 0 ] || [ $EXIT -eq 2 ]; then exit 0; else exit $EXIT; fi
                        securityContext:
                          runAsUser: 0
        - script:
            timeout: 6m
            content: |
              set -eu
              NS=e2e-autosign-policy
              DEPLOY=e2e-autosign-policy-ca
              kubectl wait --for=condition=Complete job/puppet-agent-rotated -n "${NS}" --timeout=300s

              GEN=$(kubectl get deploy "${DEPLOY}" -n "${NS}" -o jsonpath='{.metadata.generation}')
              PODS=$(kubectl get pods -n "${NS}" -o name | grep "^pod/${DEPLOY}-" | grep -v -- '-ca-setup-' | sort)
              [ "${GEN}" = "$(cat /tmp/autosign-policy-generation)" ] \
                || { echo "ERROR: the CA deployment changed (generation ${GEN})"; exit 1; }
              [ "${PODS}" = "$(cat /tmp/autosign-policy-pods)" ] \
                || { echo "ERROR: the CA pod was replaced: ${PODS}"; exit 1; }
              echo "OK: the rotated policy signed a CSR without rolling the CA pod"
      finally:
        - script:
            timeout: 2m
            content: |
              kubectl logs -n e2e-autosign-policy job/puppet-agent-match || true
              kubectl logs -n e2e-autosign-policy job/puppet-agent-nomatch || true
              kubectl logs -n e2e-autosign-policy job/puppet-agent-rotated || true
              helm uninstall e2e-autosign-policy --namespace e2e-autosign-policy --wait 2>/dev/null || true
              kubectl delete namespace e2e-autosign-policy --ignore-not-found 2>/dev/null || true
